<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotomandadoRDT - Cliente (Modo MAPA)</title>
    <link rel="stylesheet" href="variables.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Librerías de Leaflet para el Mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .app-container { max-width: 600px; margin: 0 auto; padding: var(--spacing-md); min-height: 100vh; display: flex; flex-direction: column; gap: var(--spacing-md); }
        .header { display: flex; justify-content: space-between; align-items: center; padding: var(--spacing-sm) 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .card { background: var(--color-bg-secondary); border-radius: var(--radius-md); padding: var(--spacing-md); box-shadow: var(--shadow-premium); border: 1px solid rgba(255,255,255,0.05); }
        .form { display: flex; flex-direction: column; gap: var(--spacing-sm); }
        .form__group { display: flex; flex-direction: column; gap: var(--spacing-xs); }
        .form__label { color: var(--color-text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        .button { padding: var(--spacing-sm) var(--spacing-md); border-radius: var(--radius-sm); font-weight: 600; text-align: center; border: none; cursor: pointer; transition: 0.3s; }
        .button--primary { background: var(--gradient-primary); color: white; }
        .button--block { display: block; width: 100%; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); display: flex; align-items: center; justify-content: center; z-index: 5000; padding: var(--spacing-md); }
        .hidden { display: none !important; }
        .message { padding: 8px 12px; border-radius: 12px; max-width: 85%; font-size: 0.85rem; }
        .message--client { align-self: flex-end; background: var(--color-accent-primary); color: var(--color-bg-primary); }
        .message--moto { align-self: flex-start; background: rgba(255,255,255,0.1); color: white; }
        .history-item { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid var(--color-accent-success); }
        
        /* Ajuste para el divIcon del mapa */
        .leaflet-div-icon { background: transparent; border: none; font-size: 24px; line-height: 1; text-align: center; }
    </style>
</head>
<body>

    <div id="auth-modal" class="modal">
        <div class="card" style="width: 100%; max-width: 400px; padding: 2.5rem;">
            <div style="text-align:center; margin-bottom: 25px;">
               <h2 style="color:white; letter-spacing:2px;">MOTOMANDADO</h2>
               <p style="font-size:0.75rem; color:var(--color-text-muted);">ACCESO CLIENTES (MODO MAPA)</p>
            </div>
            <div class="form">
                <input type="email" id="auth-email" placeholder="tu@email.com">
                <input type="password" id="auth-pass" placeholder="Contraseña">
                <button class="button button--primary button--block" id="btn-login">INGRESAR</button>
                <button id="link-show-register" style="background:none; border:none; color:var(--color-text-muted); font-size:0.8rem; margin-top:10px;">¿Nuevo? Regístrate acá</button>
            </div>
        </div>
    </div>

    <div id="client-register-modal" class="modal hidden">
        <div class="card" style="width: 100%; max-width: 450px;">
            <h2 style="text-align:center; margin-bottom:20px;">REGISTRARSE</h2>
            <div class="form">
                <input type="text" id="reg-name" placeholder="Nombre Completo">
                <input type="tel" id="reg-phone" placeholder="Teléfono">
                <input type="email" id="reg-email" placeholder="Email">
                <input type="password" id="reg-pass" placeholder="Contraseña">
                <button class="button button--primary button--block" id="btn-register-client">CREAR CUENTA</button>
                <button id="link-back-login" style="background:none; border:none; color:var(--color-text-muted); margin-top:10px;">Volver al acceso</button>
            </div>
        </div>
    </div>

    <div class="app-container">
        <header class="header">
            <span style="font-weight:700; font-size:1.2rem; color:var(--color-accent-primary);">MOTORDT (Mapa)</span>
            <button id="btn-logout" style="background:transparent; border:none; color:var(--color-text-muted); font-size:0.8rem;">SALIR</button>
        </header>

        <!-- Seccion Pedido Activo -->
        <div id="active-order-section" class="hidden">
            <div class="card" style="border: 1px solid var(--color-accent-success);">
                <h3 style="color:var(--color-accent-success); margin-bottom:10px;">🚀 Pedido en Curso</h3>
                <div id="active-order-info" style="font-size:0.9rem; line-height:1.5;"></div>
                
                <div id="chat-section" style="margin-top:15px; border-top:1px solid rgba(255,255,255,0.1); padding-top:15px;">
                    <div id="chat-messages" style="height:150px; overflow-y:auto; margin-bottom:10px; display:flex; flex-direction:column; gap:8px;"></div>
                    <div style="display:flex; gap:5px;">
                        <input type="text" id="chat-input" placeholder="Escribe al conductor..." style="flex:1; padding:8px; border-radius:5px; border:none; background:rgba(255,255,255,0.05); color:white;">
                        <button onclick="sendMessage()" style="padding:8px 12px; background:var(--color-accent-primary); color:white; border:none; border-radius:5px;">➤</button>
                    </div>
                </div>

                <button onclick="cancelarPedidoActual()" style="width:100%; margin-top:15px; padding:10px; background:transparent; border:1px solid var(--color-accent-error); color:var(--color-accent-error); border-radius:5px; font-size:0.8rem; font-weight:700;">CANCELAR PEDIDO</button>
            </div>
        </div>

        <!-- Formulario Nuevo Pedido CON MAPA -->
        <section class="card" id="new-order-section">
            <h3 style="margin-bottom:5px;">Selecciona en el mapa</h3>
            <p style="font-size:0.75rem; color:var(--color-text-muted); margin-bottom:15px;">Mueve el círculo 🟢 al Origen y el 🔴 al Destino.</p>
            
            <div id="map" style="height: 300px; width: 100%; border-radius: 8px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); z-index: 1;"></div>

            <div class="form">
                <input type="text" id="order-origin-text" placeholder="Escribe tu origen o mueve el pin 🟢..." style="font-size:0.85rem; padding: 12px; border: 1px solid rgba(255,255,255,0.2);">
                <input type="text" id="order-dest-text" placeholder="Escribe tu destino o mueve el pin 🔴..." style="font-size:0.85rem; padding: 12px; border: 1px solid rgba(255,255,255,0.2);">
                <input type="number" id="order-compra" placeholder="💰 Costo de Compra (opcional)">
                <textarea id="order-desc" placeholder="📦 Detalles (Ej: Casa rejas blancas, timbre 2)" rows="2"></textarea>
                
                <div id="price-preview" style="background:rgba(255,255,255,0.03); padding:15px; border-radius:8px; border:1px dashed var(--color-accent-primary);">
                    <div style="display:flex; justify-content:space-between; font-size:0.85rem; color:var(--color-text-muted);">
                        <span>Distancia GPS: <span id="preview-dist" style="color:var(--color-accent-primary); font-weight:600;">Calculando...</span></span>
                        <span>Total: <span id="preview-total" style="color:var(--color-accent-success); font-weight:700; font-size:1.1rem;">$0</span></span>
                    </div>
                </div>

                <button class="button button--primary button--block" id="btn-create-order" style="padding:15px; font-size:1rem;">SOLICITAR MOTO</button>
            </div>
        </section>

        <!-- Historial -->
        <button id="btn-toggle-history" onclick="toggleHistory()" style="background:rgba(255,255,255,0.02); border:none; color:var(--color-text-muted); padding:10px; border-radius:8px; font-size:0.8rem; letter-spacing:1px;">📦 VER HISTORIAL DE VIAJES</button>
        <div id="history-section" class="hidden">
            <h4 style="color:var(--color-text-muted); font-size:0.8rem; margin-bottom:10px; text-align:center;">Viajes Finalizados</h4>
            <div id="history-container"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://aodoaefxnnpgjwcyfixx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_RRSZspZq5acSI3J_eT4HUg_Txykyu2S';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let activeOrder = null;
        let configGlobal = { precio_base: 2500, ciudad: 'Rosario del Tala', provincia: 'Entre Ríos', numeros_por_cuadra: 50 };
        let currentCalculation = { cuadras: 0, monto: 0, coords: null };

        let map, markerOrigen, markerDestino;
        let mapInitialized = false;

        // CONFIG & AUTH
        async function loadConfig() {
            const { data } = await sb.from('configuracion').select('*').single();
            if (data) configGlobal = data;
        }

        async function checkSession() {
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                currentUser = session.user;
                document.getElementById('auth-modal').classList.add('hidden');
                document.getElementById('client-register-modal').classList.add('hidden');
                await checkActiveOrder();
                subscribeRealtime();
            }
        }

        // LÓGICA DEL MAPA
        async function initMap() {
            if (mapInitialized) return;
            mapInitialized = true;

            let lat = -32.3025, lon = -59.1458; // Default Tala aprox
            try {
                const q = `${configGlobal.ciudad}, ${configGlobal.provincia}, Argentina`;
                const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1`);
                const data = await res.json();
                if (data && data.length > 0) { lat = parseFloat(data[0].lat); lon = parseFloat(data[0].lon); }
            } catch(e) {}

            map = L.map('map').setView([lat, lon], 15);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);

            const iconOrigen = L.divIcon({ html: '🟢', className: 'leaflet-div-icon', iconSize: [24,24], iconAnchor: [12,12] });
            const iconDestino = L.divIcon({ html: '🔴', className: 'leaflet-div-icon', iconSize: [24,24], iconAnchor: [12,12] });

            markerOrigen = L.marker([lat - 0.002, lon - 0.002], { draggable: true, icon: iconOrigen }).addTo(map);
            markerDestino = L.marker([lat + 0.002, lon + 0.002], { draggable: true, icon: iconDestino }).addTo(map);

            markerOrigen.on('dragend', () => updateRutaMap(true));
            markerDestino.on('dragend', () => updateRutaMap(true));
            
            // Eventos para mover los pines cuando el usuario escribe
            let timerOrig, timerDest;
            document.getElementById('order-origin-text').addEventListener('input', (e) => {
                clearTimeout(timerOrig);
                timerOrig = setTimeout(() => buscarYubicarPin(e.target.value.replace('🟢 ', ''), markerOrigen), 1200);
            });
            document.getElementById('order-dest-text').addEventListener('input', (e) => {
                clearTimeout(timerDest);
                timerDest = setTimeout(() => buscarYubicarPin(e.target.value.replace('🔴 ', ''), markerDestino), 1200);
            });

            // Retrasar la primera actualización para que se vea fluido
            setTimeout(() => updateRutaMap(true), 500);
        }

        async function buscarYubicarPin(texto, marker) {
            if (texto.length < 3) return;
            document.getElementById('preview-dist').textContent = "Buscando calle...";
            try {
                // Buscamos la calle en la ciudad actual
                const q = `${texto}, ${configGlobal.ciudad}, ${configGlobal.provincia}, Argentina`;
                let res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1`);
                let data = await res.json();
                
                // Si no encuentra por numeración exacta, buscamos solo el nombre de la calle
                if (!data || data.length === 0) {
                    const calleSinNumero = texto.replace(/\d+/g, '').trim();
                    res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(calleSinNumero + ', ' + configGlobal.ciudad)}&format=json&limit=1`);
                    data = await res.json();
                }

                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    marker.setLatLng([lat, lon]);
                    map.setView([lat, lon], 16);
                    updateRutaMap(false); // Falso para no sobreescribir el texto que el usuario acaba de escribir
                } else {
                    document.getElementById('preview-dist').textContent = "Calle no encontrada en el mapa. Mueve el pin manual.";
                }
            } catch(e) {}
        }

        async function updateRutaMap(updateText = true) {
            document.getElementById('preview-dist').textContent = "Calculando GPS...";
            const o = markerOrigen.getLatLng();
            const d = markerDestino.getLatLng();

            // Reverse Geocoding (Convertir GPS a Nombre de calle) solo si se movió el pin manualmente
            if (updateText) {
                try {
                    const rO = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${o.lat}&lon=${o.lng}&format=json`);
                    const dO = await rO.json();
                    if(dO.address && dO.address.road) document.getElementById('order-origin-text').value = `🟢 ${dO.address.road} ${dO.address.house_number||''}`.trim();

                    const rD = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${d.lat}&lon=${d.lng}&format=json`);
                    const dD = await rD.json();
                    if(dD.address && dD.address.road) document.getElementById('order-dest-text').value = `🔴 ${dD.address.road} ${dD.address.house_number||''}`.trim();
                } catch(e) {}
            }

            // Calcular distancia OSRM (o usar distancia matemática si el servidor externo falla)
            let m = 0;
            try {
                const route = await fetch(`https://router.project-osrm.org/route/v1/driving/${o.lng},${o.lat};${d.lng},${d.lat}?overview=false`);
                const rData = await route.json();
                if (rData.code === 'Ok') {
                    m = rData.routes[0].distance;
                } else {
                    throw new Error("OSRM devolvió error");
                }
            } catch(e) {
                // Si el servidor público de rutas está saturado, calculamos la distancia 
                // geométrica real entre los dos puntos y le sumamos un 30% (factor de calles/esquinas)
                m = o.distanceTo(d) * 1.3;
            }

            const cuadras = Math.max(1, Math.round(m/100)); // 1 cuadra = 100m
            
            const compra = parseFloat(document.getElementById('order-compra').value) || 0;
            const costoViaje = configGlobal.precio_base + (cuadras * (configGlobal.precio_base * 0.02));
            const total = Math.round(costoViaje + compra);
            
            currentCalculation = { cuadras, monto: total, coords: {o, d} };
            
            document.getElementById('preview-dist').textContent = `${cuadras} cuadras GPS`;
            document.getElementById('preview-total').textContent = `$${total.toLocaleString()}`;
        }

        document.getElementById('order-compra').oninput = updateRutaMap;

        // ORDERS & TIMEOUT
        document.getElementById('btn-create-order').onclick = async () => {
            const originText = document.getElementById('order-origin-text').value.replace('🟢 ', '');
            const destText = document.getElementById('order-dest-text').value.replace('🔴 ', '');
            const desc = document.getElementById('order-desc').value;
            const compra = parseFloat(document.getElementById('order-compra').value) || 0;

            if (currentCalculation.monto === 0) return alert("Espera a que termine de calcular la ruta.");

            const { data: nextD } = await sb.from('PERFILES').select('id').eq('role', 'repartidor').eq('esta_activo', true).order('ultima_vez_libre', { ascending: true }).limit(1);
            const driverId = nextD && nextD.length > 0 ? nextD[0].id : null;

            const { data: order, error } = await sb.from('pedidos').insert({
                cliente_id: currentUser.id,
                descripcion: `${originText} -> ${destText} | Notas: ${desc}`,
                estado: 'pendiente',
                monto: currentCalculation.monto,
                distancia_cuadras: currentCalculation.cuadras,
                costo_compra: compra,
                asignado_a: driverId,
                asignado_en: driverId ? new Date().toISOString() : null
            }).select().single();

            if (error) alert(error.message);
            else {
                alert("Pedido solicitado con éxito. El conductor recibirá las coordenadas GPS.");
                checkActiveOrder();
                if (order) startWatchdog(order.id);
            }
        };

        function startWatchdog(orderId) {
            const startTime = new Date();
            const interval = setInterval(async () => {
                const { data: o } = await sb.from('pedidos').select('*').eq('id', orderId).maybeSingle();
                if (!o || o.estado !== 'pendiente') return clearInterval(interval);

                const totalSecs = (new Date() - startTime) / 1000;
                if (totalSecs > 300) { // 5 minutos total
                    clearInterval(interval);
                    await sb.from('pedidos').update({ estado: 'cancelado' }).eq('id', orderId);
                    alert("⚠️ No se encontró conductor en 5 minutos. Pedido cancelado.");
                    checkActiveOrder();
                } else if (!o.asignado_a || (new Date() - new Date(o.asignado_en)) > 60000) {
                    const { data: next } = await sb.from('PERFILES').select('id').eq('role', 'repartidor').eq('esta_activo', true).order('ultima_vez_libre', { ascending: true }).limit(1);
                    if (next && next.length > 0) {
                        await sb.from('pedidos').update({ asignado_a: next[0].id, asignado_en: new Date().toISOString() }).eq('id', orderId);
                    }
                }
            }, 10000);
        }

        async function checkActiveOrder() {
            const { data } = await sb.from('pedidos').select('*, motomandado:PERFILES!motomandado_id(nombre_completo)').eq('cliente_id', currentUser.id).in('estado', ['pendiente', 'en_viaje']).order('created_at', { ascending: false }).limit(1);
            if (data && data.length > 0) {
                activeOrder = data[0];
                document.getElementById('active-order-section').classList.remove('hidden');
                document.getElementById('new-order-section').classList.add('hidden');
                const mName = activeOrder.motomandado ? activeOrder.motomandado.nombre_completo : "Buscando...";
                document.getElementById('active-order-info').innerHTML = `
                    <p><strong>De:</strong> ${activeOrder.descripcion.split('->')[0]}</p>
                    <p><strong>A:</strong> ${activeOrder.descripcion.split('->')[1].split('|')[0]}</p>
                    <p><strong>Moto:</strong> <span style="color:var(--color-accent-primary);">${mName}</span></p>
                    <p><strong>Precio:</strong> <span style="color:var(--color-accent-success);">$${activeOrder.monto + (activeOrder.costo_compra||0)}</span></p>
                    <small>Estado: ${activeOrder.estado.toUpperCase()}</small>
                `;
                loadMessages();
            } else {
                activeOrder = null;
                document.getElementById('active-order-section').classList.add('hidden');
                document.getElementById('new-order-section').classList.remove('hidden');
                setTimeout(initMap, 500); // Iniciar mapa si no hay pedido activo
            }
            loadHistory();
        }

        async function cancelarPedidoActual() {
            if (confirm("¿Cancelar pedido?") && activeOrder) {
                await sb.from('pedidos').update({ estado: 'cancelado' }).eq('id', activeOrder.id);
                checkActiveOrder();
            }
        }

        async function loadHistory() {
            const { data } = await sb.from('pedidos').select('*').eq('cliente_id', currentUser.id).eq('estado', 'entregado').order('created_at', { ascending: false }).limit(10);
            const cont = document.getElementById('history-container');
            if (!data || data.length === 0) return cont.innerHTML = "<p style='font-size:0.7rem;'>Sin historial.</p>";
            cont.innerHTML = data.map(o => `<div class="history-item">
                <p style="font-size:0.8rem;">${o.descripcion.split('|')[0]}</p>
                <p style="font-size:0.75rem; font-weight:bold;">$${o.monto + (o.costo_compra||0)} | ${new Date(o.created_at).toLocaleDateString()}</p>
            </div>`).join('');
        }

        function toggleHistory() {
            const hist = document.getElementById('history-section');
            hist.classList.toggle('hidden');
            document.getElementById('btn-toggle-history').innerText = hist.classList.contains('hidden') ? "📦 VER HISTORIAL DE VIAJES" : "🔼 OCULTAR HISTORIAL";
        }

        // CHAT
        async function loadMessages() {
            if(!activeOrder) return;
            const { data } = await sb.from('mensajes').select('*').eq('pedido_id', activeOrder.id).order('created_at', { ascending: true });
            const box = document.getElementById('chat-messages');
            box.innerHTML = (data||[]).map(m => `<div class="message ${m.emisor_id === currentUser.id ? 'message--client' : 'message--moto'}">${m.texto}</div>`).join('');
            box.scrollTop = box.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const txt = input.value.trim();
            if(!txt || !activeOrder) return;
            const { error } = await sb.from('mensajes').insert({ pedido_id: activeOrder.id, emisor_id: currentUser.id, texto: txt });
            if(!error) { input.value = ''; loadMessages(); }
        }

        function subscribeRealtime() {
            sb.channel('db-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, checkActiveOrder)
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensajes' }, loadMessages).subscribe();
        }

        // AUTH CLICKS
        document.getElementById('btn-login').onclick = async () => {
            const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('auth-email').value, password: document.getElementById('auth-pass').value });
            if (error) alert(error.message); else checkSession();
        };
        document.getElementById('link-show-register').onclick = () => { document.getElementById('auth-modal').classList.add('hidden'); document.getElementById('client-register-modal').classList.remove('hidden'); };
        document.getElementById('link-back-login').onclick = () => { document.getElementById('client-register-modal').classList.add('hidden'); document.getElementById('auth-modal').classList.remove('hidden'); };
        document.getElementById('btn-register-client').onclick = async () => {
            const { data, error } = await sb.auth.signUp({ email: document.getElementById('reg-email').value, password: document.getElementById('reg-pass').value, options: { data: { nombre_completo: document.getElementById('reg-name').value, telefono: document.getElementById('reg-phone').value, role: 'cliente' } } });
            if (error) alert(error.message); else if (data.session) checkSession(); else alert("Verifica tu correo.");
        };
        document.getElementById('btn-logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

        loadConfig().then(() => {
            checkSession();
        });
    </script>
</body>
</html>
