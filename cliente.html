<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotomandadoRDT - Cliente</title>
    <link rel="stylesheet" href="variables.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Base BEM Styles for Cliente */
        .app-container {
            max-width: 600px;
            margin: 0 auto;
            padding: var(--spacing-md);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-sm) 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }


        .card {
            background: var(--color-bg-secondary);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            box-shadow: var(--shadow-premium);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .form__group {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
        }

        .form__label {
            color: var(--color-text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .button {
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-sm);
            font-weight: 600;
            text-align: center;
            display: inline-block;
        }

        .button--primary {
            background: var(--gradient-primary);
            color: white;
        }

        .button--block {
            display: block;
            width: 100%;
        }

        .order-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .order-card {
            background: rgba(255,255,255,0.03);
            border-radius: var(--radius-sm);
            padding: var(--spacing-sm);
            border-left: 4px solid var(--color-accent-primary);
            transition: var(--transition-smooth);
        }

        .order-card--en-viaje { border-left-color: var(--color-accent-warning); }
        .order-card--entregado { border-left-color: var(--color-accent-success); opacity: 0.7; }

        .status-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            float: right;
        }

        /* Overlay for Profile / Auth */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: var(--spacing-md);
        }

        .hidden { display: none !important; }

        .chat-widget {
            position: fixed;
            bottom: var(--spacing-md);
            right: var(--spacing-md);
            width: 300px;
            max-height: 400px;
            background: var(--color-bg-secondary);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-premium);
            border: 1px solid var(--color-accent-primary);
        }

        .chat-widget__header {
            padding: var(--spacing-xs) var(--spacing-sm);
            background: var(--color-accent-primary);
            color: var(--color-bg-primary);
            font-weight: 700;
            border-radius: var(--radius-md) var(--radius-md) 0 0;
        }

        .chat-widget__messages {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-sm);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
        }

        .message {
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 80%;
            font-size: 0.9rem;
        }

        .message--client {
            align-self: flex-end;
            background: var(--color-accent-primary);
            color: var(--color-bg-primary);
        }

        .message--moto {
            align-self: flex-start;
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <div id="auth-modal" class="modal">
        <div class="card" style="width: 100%; max-width: 400px; padding: 2.5rem;">
            <div style="text-align:center; margin-bottom: 25px;">
               <h2 class="header__title">MOTOMANDADO</h2>
               <p style="font-size:0.75rem; color:var(--color-text-muted); text-transform:uppercase; letter-spacing:2px; margin-top:5px;">Acceso Clientes</p>
            </div>
            <div class="form">
                <div class="form__group" style="margin-bottom: 5px;">
                    <label class="form__label" for="auth-email">Email</label>
                    <input type="email" id="auth-email" placeholder="tu@email.com">
                </div>
                <div class="form__group" style="margin-bottom: 15px;">
                    <label class="form__label" for="auth-pass">Contraseña</label>
                    <input type="password" id="auth-pass" placeholder="******">
                </div>
                <button class="button button--primary button--block" id="btn-login" style="padding: 12px;">INGRESAR</button>
                <p style="text-align: center; font-size: 0.8rem; margin-top: 15px;">
                    <button id="link-show-register" style="background:none; border:none; color:var(--color-text-muted);">¿Nuevo? Regístrate acá</button>
                </p>
            </div>
        </div>
    </div>

    <div id="client-register-modal" class="modal hidden">
        <div class="card" style="width: 100%; max-width: 450px; padding: 2rem;">
            <div style="text-align:center; margin-bottom: 20px;">
               <h2 class="header__title" style="font-size: 2rem;">REGISTRARSE</h2>
               <p style="font-size:0.75rem; color:var(--color-text-muted); text-transform:uppercase; letter-spacing:1px; margin-top:5px;">Crea tu cuenta para pedir motos</p>
            </div>
            <div class="form">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 5px;">
                    <div class="form__group">
                        <label class="form__label">Nombre</label>
                        <input type="text" id="reg-name" placeholder="Tu Nombre">
                    </div>
                    <div class="form__group">
                        <label class="form__label">Teléfono</label>
                        <input type="tel" id="reg-phone" placeholder="Ej: 11234567">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                    <div class="form__group">
                        <label class="form__label">Email</label>
                        <input type="email" id="reg-email" placeholder="correo@mail.com">
                    </div>
                    <div class="form__group">
                        <label class="form__label">Contraseña</label>
                        <input type="password" id="reg-pass" placeholder="***">
                    </div>
                </div>
                <button class="button button--primary button--block" id="btn-register-client" style="padding: 12px; background: #27272a; color: white !important; border: 1px solid rgba(255,255,255,0.1);">REGISTRARSE</button>
                <p style="text-align: center; font-size: 0.8rem; margin-top: 15px;">
                    <button id="link-back-login" style="background:none; border:none; color:var(--color-text-muted);">Volver al acceso</button>
                </p>
            </div>
        </div>
    </div>

    <div id="profile-modal" class="modal hidden">
        <div class="card" style="width: 100%; max-width: 400px;">
            <h2 class="header__title">Completa tu Perfil</h2>
            <p style="font-size: 0.8rem; margin-bottom: var(--spacing-md);">Solo la primera vez</p>
            <div class="form">
                <input type="text" id="prof-name" placeholder="Nombre Completo">
                <input type="tel" id="prof-phone" placeholder="Teléfono de Contacto">
                <button class="button button--primary button--block" id="btn-save-profile">Guardar</button>
            </div>
        </div>
    </div>

    <div class="app-container">
        <header class="header">
            <span class="header__title" style="font-size: 1.5rem; letter-spacing: 1px;">MOTOMANDADO</span>
            <button class="button" id="btn-logout" style="background: transparent; color: var(--color-text-muted); font-size: 0.8rem;">CERRAR SESIÓN</button>
        </header>

        <section class="card">
            <h3 style="margin-bottom: var(--spacing-sm);">Nuevo Pedido</h3>
            <div class="form">
                <input type="text" id="order-origin" placeholder="📍 Punto de Origen (Ej: Urquiza 400)">
                <input type="text" id="order-dest" placeholder="🏁 Punto de Destino (Ej: 25 de Mayo 600)">
                <input type="number" id="order-compra" placeholder="💰 Costo de Compra (opcional)" style="margin-top: 5px;">
                <textarea id="order-desc" placeholder="📦 ¿Qué llevamos?" rows="2"></textarea>
                
                <div id="price-preview" class="hidden" style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: var(--radius-sm); border: 1px dashed var(--color-accent-primary); margin: 10px 0;">
                    <div style="display:flex; justify-content:space-between; font-size:0.8rem;">
                        <span>Distancia estimada:</span>
                        <span id="preview-dist" style="color:var(--color-accent-primary); font-weight:600;">-</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; font-size:1.1rem; margin-top:5px; font-weight:700;">
                        <span>Total estimado:</span>
                        <span id="preview-total" style="color:var(--color-accent-success);">$0</span>
                    </div>
                    <small id="preview-detail" style="font-size:0.6rem; color:var(--color-text-muted); display:block; margin-top:5px;"></small>
                </div>

                <button class="button button--primary button--block" id="btn-create-order">Solicitar Moto</button>
            </div>
        </section>

        <section>
            <h3 style="margin-bottom: var(--spacing-sm);">Mis Pedidos</h3>
            <div id="orders-container" class="order-list">
                <!-- Pedidos inyectados por JS -->
            </div>
        </section>
    </div>

    <div id="chat-container" class="chat-widget hidden">
        <div class="chat-widget__header">Chat con el Repartidor</div>
        <div id="chat-messages" class="chat-widget__messages"></div>
        <div style="padding: var(--spacing-xs); display: flex; gap: 5px;">
            <input type="text" id="chat-input" placeholder="Escribe..." style="flex:1;">
            <button class="button button--primary" id="btn-send-msg">➤</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://aodoaefxnnpgjwcyfixx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_RRSZspZq5acSI3J_eT4HUg_Txykyu2S';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let activeChatOrder = null;
        let configGlobal = { precio_base: 2500, ciudad: 'Rosario del Tala', provincia: 'Entre Ríos', numeros_por_cuadra: 50 };
        let currentCalculation = { cuadras: 0, monto: 0 };

        // CONFIG & PRICE LOGIC
        async function loadConfig() {
            const { data } = await sb.from('configuracion').select('*').single();
            if (data) configGlobal = data;
        }

        // Debounce calculation
        let calcTimeout;
        const triggerCalculation = () => {
            clearTimeout(calcTimeout);
            calcTimeout = setTimeout(presupuestarPedido, 800);
        };

        document.getElementById('order-origin').oninput = triggerCalculation;
        document.getElementById('order-dest').oninput = triggerCalculation;
        document.getElementById('order-compra').oninput = triggerCalculation;

        async function presupuestarPedido() {
            const origin = document.getElementById('order-origin').value.trim();
            const dest = document.getElementById('order-dest').value.trim();
            const compra = parseFloat(document.getElementById('order-compra').value) || 0;

            if (origin.length < 5 || dest.length < 5) return;

            document.getElementById('price-preview').classList.remove('hidden');
            document.getElementById('preview-dist').textContent = "Calculando...";

            const dist = await calcularDistancia(origin, dest);
            
            const base = configGlobal.precio_base;
            const porcuadra = base * 0.02;
            const costoViaje = base + (dist.cuadras * porcuadra);
            const total = Math.round(costoViaje + compra);

            currentCalculation = { cuadras: dist.cuadras, monto: total };

            document.getElementById('preview-dist').textContent = `${dist.cuadras} cuadras`;
            document.getElementById('preview-total').textContent = `$${total.toLocaleString('es-AR')}`;
            document.getElementById('preview-detail').textContent = dist.detalle;
        }

        async function calcularDistancia(origen, destino) {
            const ciudad = configGlobal.ciudad;
            const provincia = configGlobal.provincia;
            
            // Intento con Georef API Argentina
            try {
                const getCoords = async (dir) => {
                    const url = `https://apis.datos.gob.ar/georef/api/direcciones?direccion=${encodeURIComponent(dir)}&localidad=${encodeURIComponent(ciudad)}&provincia=${encodeURIComponent(provincia)}&max=1`;
                    const res = await fetch(url);
                    const data = await res.json();
                    if (data.direcciones && data.direcciones.length > 0) {
                        return data.direcciones[0].ubicacion;
                    }
                    return null;
                };

                const c1 = await getCoords(origen);
                const c2 = await getCoords(destino);

                if (c1 && c2) {
                    const R = 6371e3;
                    const φ1 = c1.lat * Math.PI/180;
                    const φ2 = c2.lat * Math.PI/180;
                    const Δφ = (c2.lat-c1.lat) * Math.PI/180;
                    const Δλ = (c2.lon-c1.lon) * Math.PI/180;
                    const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
                    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                    const metros = R * c;
                    const cuadras = Math.max(1, Math.round(metros / 100));
                    return { cuadras, detalle: "Calculado por GPS (Línea recta)" };
                }
            } catch (e) { console.warn("Error API Georef:", e); }

            // Fallback manual por numeración
            return calcularPorNumeracion(origen, destino);
        }

        function calcularPorNumeracion(origen, destino) {
            const parse = (dir) => {
                const match = dir.match(/^(.+?)\s+(\d+)\s*$/);
                return match ? { calle: match[1].toLowerCase().trim(), num: parseInt(match[2]) } : null;
            };
            const o = parse(origen);
            const d = parse(destino);

            if (!o || !d) return { cuadras: 5, detalle: "Tarifa plana (Dirección no reconocida)" };

            const numXCuadra = configGlobal.numeros_por_cuadra || 50;
            if (o.calle === d.calle) {
                const cuadras = Math.max(1, Math.ceil(Math.abs(o.num - d.num) / numXCuadra));
                return { cuadras, detalle: "Misma calle (Cálculo manual)" };
            }
            const cuadras = Math.max(2, Math.ceil(Math.abs(o.num - d.num) / numXCuadra) + 1);
            return { cuadras, detalle: "Diferentes calles (Estimado manual)" };
        }

        // AUTH LOGIC
        async function checkSession() {
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                currentUser = session.user;
                document.getElementById('auth-modal').classList.add('hidden');
                document.getElementById('client-register-modal').classList.add('hidden');
                
                await checkProfile(session);
                
                loadOrders();
                subscribeToChanges();
            }
        }

        document.getElementById('btn-login').onclick = async () => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-pass').value;
            const { data, error } = await sb.auth.signInWithPassword({ email, password });
            if (error) alert("Error: " + error.message);
            else checkSession();
        };

        document.getElementById('link-show-register').onclick = (e) => {
            e.preventDefault();
            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('client-register-modal').classList.remove('hidden');
        };

        document.getElementById('link-back-login').onclick = (e) => {
            e.preventDefault();
            document.getElementById('client-register-modal').classList.add('hidden');
            document.getElementById('auth-modal').classList.remove('hidden');
        };

        document.getElementById('btn-register-client').onclick = async () => {
            const name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-pass').value;

            if (!name || !phone || !email || !password) {
                return alert("Por favor completa todos los campos.");
            }

            const { data, error } = await sb.auth.signUp({ 
                email, 
                password,
                options: {
                    data: {
                        nombre_completo: name,
                        telefono: phone,
                        role: 'cliente'
                    }
                }
            });
            if (error) return alert("Error: " + error.message);
            
            if (data.session) {
                alert("¡Registro exitoso! Iniciando sesión automáticamente...");
                checkSession();
            } else {
                alert("¡Registro exitoso! Por favor, verifica tu correo electrónico antes de iniciar sesión.");
                document.getElementById('client-register-modal').classList.add('hidden');
                document.getElementById('auth-modal').classList.remove('hidden');
            }
        };

        document.getElementById('btn-logout').onclick = async () => {
            await sb.auth.signOut();
            location.reload();
        };

        // PROFILE LOGIC
        async function checkProfile(session) {
            let { data, error } = await sb
                .from('PERFILES')
                .select('*')
                .eq('id', currentUser.id)
                .single();
            
            // Auto-crear perfil si el registro dejó datos en user_metadata
            if (!data && session.user.user_metadata && session.user.user_metadata.role === 'cliente') {
                const meta = session.user.user_metadata;
                const { error: insertErr } = await sb.from('PERFILES').insert({
                    id: currentUser.id,
                    nombre_completo: meta.nombre_completo,
                    telefono: meta.telefono,
                    role: meta.role,
                    esta_activo: true
                });
                if (!insertErr) {
                    data = { role: meta.role }; // Mocking para pasar la verificación visual
                }
            }

            if (!data) {
                document.getElementById('profile-modal').classList.remove('hidden');
            } else {
                document.getElementById('profile-modal').classList.add('hidden');
            }
        }

        document.getElementById('btn-save-profile').onclick = async () => {
            const nombre = document.getElementById('prof-name').value;
            const telefono = document.getElementById('prof-phone').value;
            if (!nombre || !telefono) return alert("Por favor completa los campos.");

            const { error } = await sb.from('PERFILES').insert({
                id: currentUser.id,
                nombre_completo: nombre,
                telefono: telefono,
                role: 'cliente'
            });
            
            if (error) {
                alert(error.message);
            } else {
                document.getElementById('profile-modal').classList.add('hidden');
                alert("¡Perfil completado con éxito!");
                checkSession();
            }
        };

        // ORDERS LOGIC
        document.getElementById('btn-create-order').onclick = async () => {
            const origin = document.getElementById('order-origin').value;
            const dest = document.getElementById('order-dest').value;
            const desc = document.getElementById('order-desc').value;
            const compra = parseFloat(document.getElementById('order-compra').value) || 0;

            if(!origin || !dest) return alert("Completa origen y destino");

            // Si no se calculó aún, forzamos uno rápido
            if (currentCalculation.monto === 0) await presupuestarPedido();

            const { error } = await sb.from('pedidos').insert({
                cliente_id: currentUser.id,
                descripcion: `${origin} -> ${dest} | ${desc}`,
                estado: 'pendiente',
                monto: currentCalculation.monto,
                distancia_cuadras: currentCalculation.cuadras,
                costo_compra: compra
            });

            if (error) alert(error.message);
            else {
                alert("Pedido creado. Buscando moto...");
                document.getElementById('order-origin').value = '';
                document.getElementById('order-dest').value = '';
                document.getElementById('order-desc').value = '';
                document.getElementById('order-compra').value = '';
                document.getElementById('price-preview').classList.add('hidden');
                currentCalculation = { cuadras: 0, monto: 0 };
            }
        };

        async function loadOrders() {
            const { data, error } = await sb
                .from('pedidos')
                .select('*')
                .eq('cliente_id', currentUser.id)
                .order('created_at', { ascending: false });
            
            if (error) {
                console.error("Error cargando pedidos:", error);
                return;
            }
            renderOrders(data || []);
        }

        function renderOrders(orders) {
            const container = document.getElementById('orders-container');
            container.innerHTML = orders.map(o => `
                <div class="order-card order-card--${o.estado}" onclick="openChat('${o.id}', '${o.estado}')">
                    <span class="status-badge">${o.estado.toUpperCase()}</span>
                    <strong>Pedido #${o.id.split('-')[0]}</strong>
                    <p style="font-size: 0.8rem; color: var(--color-text-muted);">${o.descripcion}</p>
                    ${o.motomandado_id ? `<small style="color: var(--color-accent-primary);">Moto: ${o.motomandado_id.split('-')[0]}</small>` : ''}
                </div>
            `).join('');
        }

        // REALTIME
        function subscribeToChanges() {
            sb
                .channel('pedidos-cliente')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos', filter: `cliente_id=eq.${currentUser.id}` }, 
                payload => {
                    loadOrders();
                    if (activeChatOrder && payload.new.id === activeChatOrder) {
                        checkChatStatus(payload.new.estado);
                    }
                })
                .subscribe();
        }
        function checkChatStatus(estado) {
            if (estado === 'entregado') {
                document.getElementById('chat-container').classList.add('hidden');
                activeChatOrder = null;
                alert("El pedido ha sido entregado. Chat cerrado.");
            }
        }

        // CHAT LOGIC
        function openChat(orderId, estado) {
            if (estado !== 'en_viaje') {
                alert("El chat se activa cuando el pedido está 'en_viaje'");
                return;
            }
            activeChatOrder = orderId;
            document.getElementById('chat-container').classList.remove('hidden');
            loadMessages();
            subscribeToChat();
        }

        async function loadMessages() {
            const { data } = await sb
                .from('mensajes_chat')
                .select('*')
                .eq('id_pedido', activeChatOrder)
                .order('created_at', { ascending: true });
            
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML = data.map(m => `
                <div class="message ${m.remitente_id === currentUser.id ? 'message--client' : 'message--moto'}">
                    ${m.contenido}
                </div>
            `).join('');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById('btn-send-msg').onclick = async () => {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if(!msg) return;

            const { error } = await sb.from('mensajes_chat').insert({
                id_pedido: activeChatOrder,
                remitente_id: currentUser.id,
                contenido: msg
            });
            if(!error) input.value = '';
        };

        function subscribeToChat() {
            sb.channel(`chat-${activeChatOrder}`)
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensajes_chat', filter: `id_pedido=eq.${activeChatOrder}` }, 
                loadMessages)
                .subscribe();
        }

        loadConfig();
        checkSession();
    </script>
</body>
</html>
