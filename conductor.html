<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotomandadoRDT - Conductor</title>
    <link rel="stylesheet" href="variables.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .app-container {
            max-width: 600px;
            margin: 0 auto;
            padding: var(--spacing-md);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-sm);
        }

        .stat-card {
            background: var(--color-bg-secondary);
            padding: var(--spacing-sm);
            border-radius: var(--radius-md);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stat-card__value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-accent-success);
            display: block;
        }

        .stat-card__label {
            font-size: 0.7rem;
            color: var(--color-text-muted);
            text-transform: uppercase;
        }

        .switch-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.05);
            padding: var(--spacing-sm);
            border-radius: var(--radius-sm);
        }

        /* Toggle Switch Style */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #475569;
            transition: .4s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 16px; width: 16px; left: 4px; bottom: 4px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--color-accent-success); }
        input:checked + .slider:before { transform: translateX(26px); }

        .order-card {
            background: var(--color-bg-secondary);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-sm);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        .order-card--active {
            border-color: var(--color-accent-warning);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge--new { background: var(--color-accent-primary); color: white; }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--color-bg-primary);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000; padding: var(--spacing-md);
        }

        .hidden { display: none !important; }

        /* Reuse Chat Styles */
        .chat-widget {
            background: var(--color-bg-secondary);
            border-radius: var(--radius-md);
            margin-top: var(--spacing-sm);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .chat-widget__messages { height: 200px; overflow-y: auto; padding: var(--spacing-sm); }
        .message { padding: 8px 12px; border-radius: 12px; margin-bottom: 5px; font-size: 0.85rem; max-width: 85%; }
        .message--moto { align-self: flex-end; background: var(--color-accent-success); color: white; }
        .message--client { align-self: flex-start; background: rgba(255,255,255,0.1); }

        .auth-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--color-bg-primary);
            display: flex; align-items: center; justify-content: center;
            z-index: 5000; padding: var(--spacing-md);
        }
        .auth-box {
            background: var(--color-bg-secondary);
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            width: 100%; max-width: 400px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .auth-box input {
            width: 100%; padding: 10px; border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--color-bg-primary); color: white;
            font-family: inherit;
        }
        .auth-box button {
            background: var(--gradient-primary); color: white;
            padding: 10px; border-radius: 5px; cursor: pointer;
            font-weight: 700; width: 100%; border: none;
            font-family: inherit;
        }
        .auth-box hr { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 15px 0; }
        .auth-box h2 { color: white; margin-bottom: 10px; }
        .auth-box p { color: var(--color-text-muted); font-size: 0.85rem; margin-bottom: 5px; }
    </style>
</head>
<body>

    <!-- Formulario de Acceso -->
    <div id="driver-auth" class="modal">
        <div class="card" style="max-width:400px; padding:2rem; width:100%; background: var(--color-bg-secondary); border-radius:1rem; text-align:center; border: 1px solid rgba(255,255,255,0.05);">
            <h2 style="margin-bottom: 20px;">Panel Conductor</h2>
            <input type="email" id="email" placeholder="Tu Email" style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid rgba(255,255,255,0.1); background:var(--color-bg-primary); color:white;">
            <input type="password" id="pass" placeholder="Tu Contraseña" style="width:100%; padding:10px; margin-bottom:20px; border-radius:5px; border:1px solid rgba(255,255,255,0.1); background:var(--color-bg-primary); color:white;">
            <button onclick="loginDriver()" style="width:100%; padding:10px; background:var(--gradient-primary); color:white; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">ENTRAR</button>
            <button onclick="showRegister()" style="margin-top:15px; background:none; border:none; color:var(--color-text-muted); cursor:pointer;">¿Nuevo? Registrate acá</button>
        </div>
    </div>

    <!-- Modal de Registro Conductor -->
    <div id="driver-register-modal" class="modal hidden">
        <div class="card" style="max-width:400px; padding:2rem; width:100%; background: var(--color-bg-secondary); border-radius:1rem; text-align:center; border: 1px solid rgba(255,255,255,0.05);">
            <h2 style="margin-bottom: 10px;">Registro de Conductor</h2>
            <p style="color:var(--color-text-muted); margin-bottom: 20px; font-size: 0.85rem;">Ingresá tus datos para crear tu cuenta.</p>
            <input type="text" id="reg-name" placeholder="Nombre Completo" style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid rgba(255,255,255,0.1); background:var(--color-bg-primary); color:white;">
            <input type="tel" id="reg-phone" placeholder="Teléfono" style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid rgba(255,255,255,0.1); background:var(--color-bg-primary); color:white;">
            <input type="email" id="reg-email" placeholder="Email" style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid rgba(255,255,255,0.1); background:var(--color-bg-primary); color:white;">
            <input type="password" id="reg-pass" placeholder="Contraseña" style="width:100%; padding:10px; margin-bottom:20px; border-radius:5px; border:1px solid rgba(255,255,255,0.1); background:var(--color-bg-primary); color:white;">
            <button onclick="registerDriver()" style="width:100%; padding:10px; background:var(--color-accent-success); color:white; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">ENVIAR REGISTRO</button>
            <button onclick="showLogin()" style="margin-top:15px; background:none; border:none; color:var(--color-text-muted); cursor:pointer;">Cancelar</button>
        </div>
    </div>

    <!-- Contenido del Panel (envolvé lo que ya tenés con este div) -->
    <div id="driver-content" class="hidden">
        <div class="app-container">
        <header class="header">
            <div>
                <h1 class="header__title">MotoRDT Driver</h1>
                <p id="user-name" style="font-size: 0.8rem; color: var(--color-text-muted);">Cargando...</p>
            </div>
            <button id="btn-logout" style="background:none; color: var(--color-accent-error);">SALIR</button>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <span id="stat-earnings" class="stat-card__value">$0</span>
                <span class="stat-card__label">Recaudación</span>
            </div>
            <div class="stat-card">
                <span id="stat-count" class="stat-card__value">0</span>
                <span class="stat-card__label">Entregas</span>
            </div>
        </section>

        <section class="switch-container">
            <span>Estado: <strong id="status-text">Fuera de servicio</strong></span>
            <label class="switch">
                <input type="checkbox" id="toggle-active">
                <span class="slider"></span>
            </label>
        </section>

        <section id="active-order-section" class="hidden">
            <h3 style="margin-bottom: var(--spacing-sm); color: var(--color-accent-warning);">📦 Pedido en Curso</h3>
            <div id="active-order-card" class="order-card order-card--active">
                <!-- Data inyectada -->
            </div>
            
            <div class="chat-widget">
                <div id="chat-messages" class="chat-widget__messages"></div>
                <div style="padding: 10px; display: flex; gap: 5px;">
                    <input type="text" id="chat-input" style="flex:1;" placeholder="Msj a cliente...">
                    <button id="btn-send-msg" style="padding: 0 15px; background: var(--color-accent-success); border-radius: 5px;">➤</button>
                </div>
            </div>
        </section>

        <section id="pool-section">
            <h3 style="margin-bottom: var(--spacing-sm);">🚀 Pedidos Disponibles</h3>
            <div id="pool-container">
                <!-- Lista de pendientes -->
            </div>
        </section>
        </div> <!-- End of app-container -->
    </div> <!-- End of driver-content -->

    <script>
        const SUPABASE_URL = 'https://aodoaefxnnpgjwcyfixx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_RRSZspZq5acSI3J_eT4HUg_Txykyu2S';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let activeOrder = null;
        let earnings = 0;
        let deliveries = 0;

        async function checkDriver() {
            const { data: { session } } = await sb.auth.getSession();
            
            if (session) {
                currentUser = session.user;
                let { data: profile } = await sb
                    .from('PERFILES')
                    .select('role')
                    .eq('id', session.user.id)
                    .single();

                // Si no hay perfil, crearlo automáticamente leyendo los datos guardados en el registro (user_metadata)
                if (!profile && session.user.user_metadata && session.user.user_metadata.role === 'repartidor') {
                    const meta = session.user.user_metadata;
                    const { error } = await sb.from('PERFILES').insert({
                        id: session.user.id,
                        nombre_completo: meta.nombre_completo,
                        telefono: meta.telefono,
                        role: meta.role,
                        esta_activo: false
                    });
                    if (!error) {
                        profile = { role: meta.role };
                    }
                }

                if (profile && profile.role === 'repartidor') {
                    document.getElementById('driver-auth').classList.add('hidden');
                    document.getElementById('driver-register-modal').classList.add('hidden');
                    document.getElementById('driver-content').classList.remove('hidden');
                    initConductor();
                } else if (profile && profile.role === 'admin') {
                    alert("Estás logueado como Admin. Salí e ingresá con cuenta de conductor.");
                    await sb.auth.signOut();
                    location.reload();
                } else {
                    alert("No tienes permiso de conductor.");
                    await sb.auth.signOut();
                    location.reload();
                }
            } else {
                document.getElementById('driver-content').classList.add('hidden');
                showLogin();
            }
        }

        function initConductor() {
            loadProfile();
            loadPool();
            checkActiveOrder();
            subscribeRealtime();
        }

        async function loadProfile() {
            const { data } = await sb.from('PERFILES').select('*').eq('id', currentUser.id).single();
            if (data) {
                document.getElementById('user-name').innerText = data.nombre_completo;
                document.getElementById('toggle-active').checked = data.esta_activo;
                updateStatusUI(data.esta_activo);
            }
        }

        function updateStatusUI(active) {
            document.getElementById('status-text').innerText = active ? 'Disponible' : 'Fuera de servicio';
            document.getElementById('status-text').style.color = active ? 'var(--color-accent-success)' : 'var(--color-text-muted)';
        }

        document.getElementById('toggle-active').onchange = async (e) => {
            const active = e.target.checked;
            await sb.from('PERFILES').update({ esta_activo: active }).eq('id', currentUser.id);
            updateStatusUI(active);
        };

        async function loadPool() {
            const { data } = await sb.from('pedidos').select('*').eq('estado', 'pendiente');
            const container = document.getElementById('pool-container');
            container.innerHTML = data && data.length ? data.map(o => `
                <div class="order-card">
                    <span class="badge badge--new">Nuevo</span>
                    <p style="margin: 10px 0;">${o.descripcion}</p>
                    <button onclick="acceptOrder('${o.id}')" style="width:100%; padding:10px; background:var(--color-accent-primary); color:white; border-radius:5px; font-weight:700;">ACEPTAR PEDIDO</button>
                </div>
            `).join('') : '<p style="text-align:center; color:var(--color-text-muted);">No hay pedidos pendientes...</p>';
        }

        async function acceptOrder(id) {
            const { error } = await sb.from('pedidos').update({
                estado: 'en_viaje',
                motomandado_id: currentUser.id
            }).eq('id', id);
            
            if (!error) checkActiveOrder();
        }

        async function checkActiveOrder() {
            const { data } = await sb.from('pedidos')
                .select('*')
                .eq('motomandado_id', currentUser.id)
                .eq('estado', 'en_viaje')
                .single();
            
            if (data) {
                activeOrder = data;
                document.getElementById('active-order-section').classList.remove('hidden');
                document.getElementById('pool-section').classList.add('hidden');
                document.getElementById('active-order-card').innerHTML = `
                    <p><strong>Ruta:</strong> ${data.descripcion}</p>
                    <div style="margin-top:15px; display:flex; gap:10px;">
                        <input type="number" id="order-monto" placeholder="Monto $" style="flex:1;">
                        <button onclick="finalizeOrder('${data.id}')" style="background:var(--color-accent-success); padding:10px; border-radius:5px; color:white;">FINALIZAR</button>
                    </div>
                `;
                loadMessages();
                subscribeChat();
            } else {
                activeOrder = null;
                document.getElementById('active-order-section').classList.add('hidden');
                document.getElementById('pool-section').classList.remove('hidden');
            }
        }

        async function finalizeOrder(id) {
            const monto = parseFloat(document.getElementById('order-monto').value) || 0;
            const { error } = await sb.from('pedidos').update({
                estado: 'entregado',
                monto: monto
            }).eq('id', id);

            if(!error) {
                earnings += monto;
                deliveries++;
                document.getElementById('stat-earnings').innerText = `$${earnings}`;
                document.getElementById('stat-count').innerText = deliveries;
                checkActiveOrder();
            }
        }

        // REALTIME
        function subscribeRealtime() {
            sb.channel('public:pedidos')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, payload => {
                    loadPool();
                })
                .subscribe();
        }

        // CHAT (Same logic as client but different side)
        async function loadMessages() {
            if(!activeOrder) return;
            const { data } = await sb.from('mensajes_chat').select('*').eq('id_pedido', activeOrder.id).order('created_at', { ascending: true });
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML = data.map(m => `
                <div class="message ${m.remitente_id === currentUser.id ? 'message--moto' : 'message--client'}">
                    ${m.contenido}
                </div>
            `).join('');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById('btn-send-msg').onclick = async () => {
            const input = document.getElementById('chat-input');
            if(!input.value.trim() || !activeOrder) return;
            await sb.from('mensajes_chat').insert({
                id_pedido: activeOrder.id,
                remitente_id: currentUser.id,
                contenido: input.value
            });
            input.value = '';
        };

        function subscribeChat() {
            sb.channel(`chat-${activeOrder.id}`)
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensajes_chat', filter: `id_pedido=eq.${activeOrder.id}` }, loadMessages)
                .subscribe();
        }

        function showRegister() {
            document.getElementById('driver-auth').classList.add('hidden');
            document.getElementById('driver-register-modal').classList.remove('hidden');
        }

        function showLogin() {
            document.getElementById('driver-register-modal').classList.add('hidden');
            document.getElementById('driver-auth').classList.remove('hidden');
        }

        async function registerDriver() {
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            
            if (!email || !pass || !name || !phone) {
                return alert("Por favor completa todos los campos del formulario.");
            }

            const { data, error } = await sb.auth.signUp({ 
                email, 
                password: pass,
                options: {
                    data: {
                        nombre_completo: name,
                        telefono: phone,
                        role: 'repartidor'
                    }
                }
            });
            
            if (error) return alert("Error: " + error.message);
            
            alert("¡Registro exitoso! Por favor, verifica tu correo electrónico antes de iniciar sesión.");
            showLogin();
        }

        async function loginDriver() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
            
            if (error) alert(error.message);
            else checkDriver();
        }

        document.getElementById('btn-logout').onclick = async () => {
            await sb.auth.signOut();
            location.reload();
        };

        checkDriver();
    </script>
</body>
</html>
